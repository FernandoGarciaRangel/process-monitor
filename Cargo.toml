[package]
name = "process-monitor"
version = "0.2.0"
edition = "2024"
description = "Monitor de processos e recursos do Windows"
authors = ["Fernando Garcia"]
publish = false

[dependencies]
# glow (OpenGL) no lugar do wgpu padrão: um monitor de sistema não pode ser o processo pesado da lista.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.36.2"
egui_extras = "0.36.2"
egui-phosphor = "0.14.0"
sysinfo = "0.39.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1.31"

# egui e sysinfo sem otimização deixam a interface lenta; o código do app continua debugável.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
